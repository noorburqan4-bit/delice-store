<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DELICE | متجر ديليس</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--blue:#1264b5;--dark:#08396d;--light:#eef6ff;--text:#172b42}
*{box-sizing:border-box}
body{margin:0;background:#f7f9fc;color:var(--text);font-family:Tahoma,Arial,sans-serif}
button,input,select,textarea{font:inherit}
button{cursor:pointer;border:0;border-radius:10px;padding:11px 15px}
.primary{background:var(--blue);color:white}
.secondary{background:#e8f2ff;color:var(--dark)}
header{background:white;box-shadow:0 2px 15px #0b3b6810;position:sticky;top:0;z-index:10}
.top{max-width:1200px;margin:auto;padding:15px 20px;display:flex;align-items:center;justify-content:space-between;gap:15px}
.logo{font-size:29px;font-weight:900;color:var(--blue);letter-spacing:2px}
.logo small{display:block;font-size:10px;letter-spacing:3px;color:#71849b;text-align:center}
.actions{display:flex;gap:8px;align-items:center}
.hero{max-width:1200px;margin:25px auto;padding:45px 35px;border-radius:22px;background:linear-gradient(115deg,#073c78,#1680d4);color:white;display:flex;align-items:center;justify-content:space-between;gap:20px}
.hero h1{font-size:clamp(27px,5vw,45px);margin:0 0 15px}
.hero p{line-height:1.9;color:#e5f2ff}
.hero-mark{font-size:75px;opacity:.2;font-weight:900}
main{max-width:1200px;margin:30px auto;padding:0 18px}
.section-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:25px 0}
.section-head h2{margin:0;font-size:23px}
.search{width:100%;max-width:330px;border:1px solid #dce5ef;border-radius:12px;padding:12px;background:white}
.categories{display:flex;gap:10px;overflow:auto;padding:5px 0 15px}
.cat{white-space:nowrap;background:white;border:1px solid #e0e8f1;color:#37516c}
.cat.active{background:var(--blue);color:white}
.products{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px}
.card{background:white;border:1px solid #edf0f5;border-radius:16px;overflow:hidden}
.photo{height:210px;background:#f0f5fa;display:flex;align-items:center;justify-content:center;overflow:hidden}
.photo img{width:100%;height:100%;object-fit:contain}
.info{padding:14px}
.info h3{margin:0 0 9px;font-size:16px}
.desc{font-size:12px;color:#78899b;min-height:30px;line-height:1.6}
.price{color:var(--blue);font-weight:bold;font-size:19px;margin:12px 0}
.card-buttons{display:flex;gap:7px}
.card-buttons button{flex:1;font-size:12px;padding:10px 5px}
.quantity-control{display:flex;align-items:center;gap:8px;margin:12px 0}
.quantity-control input{width:75px;padding:8px;border:1px solid #dce5ef;border-radius:8px;text-align:center}
.empty{background:white;padding:35px;text-align:center;border-radius:15px;color:#71849b;grid-column:1/-1}
footer{text-align:center;padding:30px 15px;background:#082f59;color:#d9eaff;margin-top:55px;font-size:13px}
.overlay{display:none;position:fixed;inset:0;background:#071c32a8;z-index:30;align-items:center;justify-content:center;padding:15px}
.modal{background:white;border-radius:18px;padding:22px;width:min(520px,100%);max-height:90vh;overflow:auto}
.modal h2{margin-top:0}
.field{margin:12px 0}
.field label{display:block;font-size:13px;margin-bottom:6px;color:#53677e}
.field input,.field textarea,.field select{width:100%;padding:11px;border:1px solid #dce4ed;border-radius:9px;background:white}
.field textarea{min-height:75px}
.close{float:left;background:#f0f3f7}
.admin-box{background:#f3f8ff;padding:14px;border-radius:12px;margin:12px 0}
.admin-row{display:flex;justify-content:space-between;gap:8px;align-items:center;border-bottom:1px solid #e5ebf2;padding:10px 0;font-size:13px}
.cart-line{display:flex;justify-content:space-between;align-items:center;gap:10px;border-bottom:1px solid #eee;padding:12px 0}
.cart-line button{padding:6px 10px}
.qty-buttons{display:flex;align-items:center;gap:7px}
.qty-buttons button{padding:5px 10px;background:#e8f2ff;color:#08396d}
@media(max-width:850px){.products{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:600px){.top{padding:12px}.logo{font-size:24px}.hero{margin:15px;padding:28px 20px}.hero-mark{font-size:45px}.products{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.photo{height:155px}.info{padding:11px}.info h3{font-size:14px}.search{max-width:100%}.section-head{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body>

<header>
 <div class="top">
  <div class="logo">DELICE<small>QUALITY • TASTE • STYLE</small></div>
  <div class="actions">
   <button class="secondary" onclick="openCart()">🛒 السلة <span id="cartCount">0</span></button>
   <button class="primary" onclick="openLogin()">دخول الإدارة</button>
  </div>
 </div>
</header>

<section class="hero">
 <div>
  <h1>اكتشف عالم DELICE</h1>
  <p>منتجات مختارة بعناية، جودة تستحقها وتجربة تسوق سهلة ومميزة.</p>
  <button style="background:white;color:#07539b;font-weight:bold" onclick="document.getElementById('productsSection').scrollIntoView({behavior:'smooth'})">تسوق الآن ←</button>
 </div>
 <div class="hero-mark">DELICE</div>
</section>

<main id="productsSection">
 <div class="section-head">
  <h2>تسوق منتجاتنا</h2>
  <input class="search" id="search" placeholder="ابحث عن منتج..." oninput="renderProducts()">
 </div>
 <div class="categories" id="categories"></div>
 <div class="products" id="products">
  <div class="empty">جارٍ تحميل المنتجات...</div>
 </div>
</main>

<footer>DELICE © 2026 — جميع الحقوق محفوظة</footer>

<div class="overlay" id="loginModal">
 <div class="modal">
  <button class="close" onclick="closeModal('loginModal')">✕</button>
  <h2>دخول الإدارة</h2>
  <div class="field"><label>البريد الإلكتروني</label><input id="email" type="email"></div>
  <div class="field"><label>كلمة المرور</label><input id="password" type="password"></div>
  <button class="primary" style="width:100%" onclick="login()">تسجيل الدخول</button>
  <p id="loginMessage"></p>
 </div>
</div>

<div class="overlay" id="adminModal">
 <div class="modal">
  <button class="close" onclick="closeModal('adminModal')">✕</button>
  <h2>لوحة تحكم DELICE</h2>
  <div class="admin-box">
   <button class="primary" onclick="openProductForm()">＋ إضافة منتج جديد</button>
   <button class="secondary" onclick="logout()">تسجيل الخروج</button>
  </div>
  <div id="adminProducts"></div>
 </div>
</div>

<div class="overlay" id="productModal">
 <div class="modal">
  <button class="close" onclick="closeModal('productModal')">✕</button>
  <h2 id="productFormTitle">إضافة منتج</h2>
  <input type="hidden" id="editId">
  <div class="field"><label>اسم المنتج</label><input id="pName"></div>
  <div class="field"><label>القسم</label><input id="pCategory"></div>
  <div class="field"><label>السعر</label><input id="pPrice" type="number" min="0" step="0.01"></div>
  <div class="field"><label>وصف المنتج</label><textarea id="pDescription"></textarea></div>
  <div class="field"><label>صورة المنتج</label><input id="pImage" type="file" accept="image/png,image/jpeg,image/webp"></div>
  <div class="field"><label><input id="pActive" type="checkbox" checked style="width:auto"> عرض المنتج في المتجر</label></div>
  <button class="primary" style="width:100%" onclick="saveProduct()">حفظ المنتج</button>
  <p id="saveMessage"></p>
 </div>
</div>

<div class="overlay" id="detailModal">
 <div class="modal">
  <button class="close" onclick="closeModal('detailModal')">✕</button>
  <div id="detailContent"></div>
 </div>
</div>

<div class="overlay" id="cartModal">
 <div class="modal">
  <button class="close" onclick="closeModal('cartModal')">✕</button>
  <h2>سلة المشتريات</h2>
  <div id="cartItems"></div>
  <h3 id="cartTotal"></h3>
  <div class="field"><label>الاسم</label><input id="buyerName" placeholder="اسمك"></div>
  <div class="field"><label>رقم الهاتف</label><input id="buyerPhone" placeholder="رقم الهاتف"></div>
  <div class="field"><label>العنوان</label><input id="buyerAddress" placeholder="عنوان التوصيل"></div>
  <button class="primary" style="width:100%" onclick="checkout()">إرسال الطلب عبر واتساب</button>
 </div>
</div>

<script>
const SUPABASE_URL="https://grqceqdhjvfkcndshupu.supabase.co";
const SUPABASE_KEY="sb_publishable_hESgegG_7QZvZItMRsQfEg_SrE4wPvO";
const ADMIN_UID="ff1e5b12-7a35-487a-b9f1-be31f8f66347";
const WHATSAPP_NUMBER="970592841090";
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

let products=[];
let selectedCategory="الكل";
let cart=[];
let currentUser=null;

function safe(value){
 return String(value??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function money(value){return Number(value||0).toLocaleString("en-US",{maximumFractionDigits:2});}
function closeModal(id){document.getElementById(id).style.display="none";}
function showModal(id){document.getElementById(id).style.display="flex";}
function openLogin(){showModal("loginModal");}
function openCart(){renderCart();showModal("cartModal");}

async function loadProducts(){
 const {data,error}=await db.from("products").select("*").eq("is_active",true).order("created_at",{ascending:false});
 if(error){document.getElementById("products").innerHTML='<div class="empty">تعذر تحميل المنتجات.</div>';return;}
 products=data||[];
 renderCategories();
 renderProducts();
}

function renderCategories(){
 const cats=["الكل",...new Set(products.map(p=>p.category).filter(Boolean))];
 document.getElementById("categories").innerHTML=cats.map(c=>
 `<button class="cat ${selectedCategory===c?"active":""}" onclick="selectCategory('${safe(c).replace(/'/g,"\\'")}')">${safe(c)}</button>`
 ).join("");
}
function selectCategory(c){selectedCategory=c;renderCategories();renderProducts();}

function renderProducts(){
 const search=document.getElementById("search").value.trim().toLowerCase();
 const filtered=products.filter(p=>
 (selectedCategory==="الكل"||p.category===selectedCategory)&&
 (String(p.name||"").toLowerCase().includes(search)||String(p.description||"").toLowerCase().includes(search))
 );
 const area=document.getElementById("products");
 if(!filtered.length){area.innerHTML='<div class="empty">لا توجد منتجات في هذا القسم حالياً.</div>';return;}
 area.innerHTML=filtered.map(p=>`
 <article class="card">
  <div class="photo">${p.image_url?`<img src="${safe(p.image_url)}" alt="${safe(p.name)}">`:"<span>DELICE</span>"}</div>
  <div class="info">
   <h3>${safe(p.name)}</h3>
   <div class="desc">${safe(p.description||p.category||"")}</div>
   <div class="price">${money(p.price)}</div>
   <div class="quantity-control">
    <label>الكمية:</label>
    <input type="number" id="qty-${p.id}" value="1" min="1" step="1">
   </div>
   <div class="card-buttons">
    <button class="secondary" onclick="showDetails('${p.id}')">التفاصيل</button>
    <button class="primary" onclick="addToCart('${p.id}',document.getElementById('qty-${p.id}').value)">أضف للسلة</button>
   </div>
  </div>
 </article>`).join("");
}

function showDetails(id){
 const p=products.find(x=>x.id===id);if(!p)return;
 document.getElementById("detailContent").innerHTML=`
 ${p.image_url?`<img src="${safe(p.image_url)}" style="width:100%;height:230px;object-fit:contain;background:#f3f7fb;border-radius:12px">`:""}
 <h2>${safe(p.name)}</h2><p>${safe(p.description||"")}</p>
 <h3 style="color:#1264b5">${money(p.price)}</h3>
 <div class="quantity-control">
 <label>الكمية:</label>
 <input type="number" id="detailQty" value="1" min="1">
 </div>
 <button class="primary" onclick="addToCart('${p.id}',document.getElementById('detailQty').value);closeModal('detailModal')">أضف إلى السلة</button>`;
 showModal("detailModal");
}

function addToCart(id,quantity=1){
 const p=products.find(x=>x.id===id);
 if(!p)return;
 quantity=Math.floor(Number(quantity));
 if(!Number.isFinite(quantity)||quantity<1){
  alert("يرجى اختيار كمية صحيحة");
  return;
 }
 const item=cart.find(x=>x.id===id);
 if(item)item.qty+=quantity;
 else cart.push({id:p.id,name:p.name,price:Number(p.price),qty:quantity});
 updateCartCount();
 alert("تمت إضافة "+quantity+" من "+p.name+" إلى السلة");
}

function changeCartQty(id,amount){
 const item=cart.find(x=>x.id===id);
 if(!item)return;
 item.qty+=amount;
 if(item.qty<=0)cart=cart.filter(x=>x.id!==id);
 updateCartCount();
 renderCart();
}
function updateCartCount(){
 document.getElementById("cartCount").textContent=cart.reduce((s,x)=>s+x.qty,0);
}
function renderCart(){
 const box=document.getElementById("cartItems");
 if(!cart.length){
  box.innerHTML='<div class="empty">السلة فارغة حالياً</div>';
  document.getElementById("cartTotal").textContent="";
  return;
 }
 box.innerHTML=cart.map(x=>`
 <div class="cart-line">
  <div>
   <strong>${safe(x.name)}</strong>
   <div style="font-size:12px;color:#1264b5">${money(x.price)} للقطعة</div>
  </div>
  <div class="qty-buttons">
   <button onclick="changeCartQty('${x.id}',-1)">−</button>
   <strong>${x.qty}</strong>
   <button onclick="changeCartQty('${x.id}',1)">+</button>
  </div>
  <strong>${money(x.price*x.qty)}</strong>
 </div>`).join("");
 document.getElementById("cartTotal").textContent=
 "الإجمالي: "+money(cart.reduce((s,x)=>s+x.price*x.qty,0));
}

function checkout(){
 if(!cart.length){alert("السلة فارغة");return;}
 const name=document.getElementById("buyerName").value.trim();
 const phone=document.getElementById("buyerPhone").value.trim();
 const address=document.getElementById("buyerAddress").value.trim();
 if(!name||!phone||!address){alert("يرجى إدخال الاسم ورقم الهاتف والعنوان");return;}
 let msg="طلب جديد من متجر DELICE\n";
 msg+="الاسم: "+name+"\nالهاتف: "+phone+"\nالعنوان: "+address+"\n\n";
 cart.forEach(x=>{msg+=x.name+" × "+x.qty+" = "+money(x.price*x.qty)+"\n";});
 msg+="\nالإجمالي: "+money(cart.reduce((s,x)=>s+x.price*x.qty,0));
 window.open("https://wa.me/"+WHATSAPP_NUMBER+"?text="+encodeURIComponent(msg),"_blank");
}

async function login(){
 const email=document.getElementById("email").value.trim();
 const password=document.getElementById("password").value;
 const msg=document.getElementById("loginMessage");
 msg.textContent="جارٍ تسجيل الدخول...";
 const {data,error}=await db.auth.signInWithPassword({email,password});
 if(error){msg.textContent="تعذر تسجيل الدخول: "+error.message;return;}
 if(data.user.id!==ADMIN_UID){
  await db.auth.signOut();
  msg.textContent="هذا الحساب غير مخوّل لإدارة المتجر.";
  return;
 }
 currentUser=data.user;
 closeModal("loginModal");
 await loadAdminProducts();
 showModal("adminModal");
}

async function logout(){
 await db.auth.signOut();
 currentUser=null;
 closeModal("adminModal");
}

async function loadAdminProducts(){
 const {data,error}=await db.from("products").select("*").order("created_at",{ascending:false});
 if(error){alert("تعذر تحميل قائمة الإدارة: "+error.message);return;}
 document.getElementById("adminProducts").innerHTML=(data||[]).map(p=>`
 <div class="admin-row">
 <span>${safe(p.name)} — ${money(p.price)} ${p.is_active?"":"(مخفي)"}</span>
 <span>
 <button class="secondary" onclick="editProduct('${p.id}')">تعديل</button>
 <button style="background:#ffe9e9;color:#a22" onclick="deleteProduct('${p.id}')">حذف</button>
 </span>
 </div>`).join("")||"لا توجد منتجات.";
}

function openProductForm(){
 document.getElementById("productFormTitle").textContent="إضافة منتج جديد";
 document.getElementById("editId").value="";
 ["pName","pCategory","pPrice","pDescription"].forEach(id=>document.getElementById(id).value="");
 document.getElementById("pImage").value="";
 document.getElementById("pActive").checked=true;
 document.getElementById("saveMessage").textContent="";
 showModal("productModal");
}

async function editProduct(id){
 const {data,error}=await db.from("products").select("*").eq("id",id).single();
 if(error){alert(error.message);return;}
 document.getElementById("productFormTitle").textContent="تعديل المنتج";
 document.getElementById("editId").value=data.id;
 document.getElementById("pName").value=data.name||"";
 document.getElementById("pCategory").value=data.category||"";
 document.getElementById("pPrice").value=data.price||"";
 document.getElementById("pDescription").value=data.description||"";
 document.getElementById("pImage").value="";
 document.getElementById("pActive").checked=data.is_active!==false;
 document.getElementById("saveMessage").textContent="";
 showModal("productModal");
}

async function saveProduct(){
 if(!currentUser||currentUser.id!==ADMIN_UID){alert("غير مخوّل");return;}
 const name=document.getElementById("pName").value.trim();
 const category=document.getElementById("pCategory").value.trim();
 const price=Number(document.getElementById("pPrice").value);
 const description=document.getElementById("pDescription").value.trim();
 const editId=document.getElementById("editId").value;
 const active=document.getElementById("pActive").checked;
 const file=document.getElementById("pImage").files[0];
 const msg=document.getElementById("saveMessage");
 if(!name||!category||!Number.isFinite(price)||price<0){
  msg.textContent="يرجى إدخال الاسم والقسم والسعر بشكل صحيح.";
  return;
 }
 msg.textContent="جارٍ حفظ المنتج...";
 let imageUrl=null;
 if(file){
  if(file.size>5*1024*1024){msg.textContent="حجم الصورة يجب ألا يتجاوز 5 ميغابايت.";return;}
  const ext=file.name.split(".").pop().toLowerCase();
  const path=Date.now()+"-"+Math.random().toString(36).slice(2)+"."+ext;
  const {error:uploadError}=await db.storage.from("product-images").upload(path,file,{upsert:false});
  if(uploadError){msg.textContent="فشل رفع الصورة: "+uploadError.message;return;}
  imageUrl=db.storage.from("product-images").getPublicUrl(path).data.publicUrl;
 }
 const record={name,category,price,description,is_active:active};
 if(imageUrl)record.image_url=imageUrl;
 let result;
 if(editId)result=await db.from("products").update(record).eq("id",editId);
 else result=await db.from("products").insert(record);
 if(result.error){msg.textContent="تعذر الحفظ: "+result.error.message;return;}
 msg.textContent="تم حفظ المنتج بنجاح.";
 await loadProducts();
 await loadAdminProducts();
 setTimeout(()=>closeModal("productModal"),700);
}

async function deleteProduct(id){
 if(!confirm("هل أنت متأكد من حذف هذا المنتج؟"))return;
 const {error}=await db.from("products").delete().eq("id",id);
 if(error){alert("تعذر الحذف: "+error.message);return;}
 await loadProducts();
 await loadAdminProducts();
}

db.auth.getSession().then(({data})=>{
 const user=data.session?.user;
 if(user?.id===ADMIN_UID)currentUser=user;
});
loadProducts();
</script>
</body>
</html>
